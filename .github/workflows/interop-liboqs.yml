name: Interop liboqs

# Déclenchement manuel uniquement. Ce workflow n'a JAMAIS tourné : tant qu'il n'est pas
# vert, ne rien en conclure (voir CHANGELOG).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versions épinglées, relevées dans la documentation officielle :
  # - liboqs 0.16.0 : dernier tag de https://github.com/open-quantum-safe/liboqs
  # - liboqs-python 0.16.0.1 : version de maintenance « still built for liboqs 0.16.0 »
  #   (https://github.com/open-quantum-safe/liboqs-python/blob/main/RELEASE.md), Python >= 3.10
  LIBOQS_VERSION: "0.16.0"
  LIBOQS_PYTHON_VERSION: "0.16.0.1"

jobs:
  interop:
    name: ML-DSA-65 liboqs <-> dilithium-py
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libssl-dev git

      - name: Build and install liboqs ${{ env.LIBOQS_VERSION }}
        run: |
          git clone --depth=1 --branch "${LIBOQS_VERSION}" https://github.com/open-quantum-safe/liboqs
          cmake -S liboqs -B liboqs/build -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON
          cmake --build liboqs/build --parallel 4
          sudo cmake --build liboqs/build --target install
          sudo ldconfig

      - name: Install liboqs-python ${{ env.LIBOQS_PYTHON_VERSION }} and the verifier dependencies
        env:
          OQS_INSTALL_PATH: /usr/local
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/open-quantum-safe/liboqs-python.git@${LIBOQS_PYTHON_VERSION}"
          pip install cryptography "rfc8785>=0.1.4,<0.2" "base58>=2.1.0" "dilithium-py>=1.0.0"

      - name: Show the versions in use
        env:
          OQS_INSTALL_PATH: /usr/local
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          python -c "import oqs, dilithium_py; print('liboqs-python', oqs.oqs_python_version(), '| liboqs', oqs.oqs_version())"
          pip list 2>/dev/null | grep -i -E "liboqs|dilithium|rfc8785|base58|cryptography"

      - name: Interoperability (sign/verify both ways + vectors verified by liboqs)
        env:
          OQS_INSTALL_PATH: /usr/local
          LD_LIBRARY_PATH: /usr/local/lib
        run: python scripts/interop_liboqs.py
